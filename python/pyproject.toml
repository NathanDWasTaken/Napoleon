[project]
name = "nagrica"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
nagrica = "nagrica.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
pythonpath  = ["src", "."]
