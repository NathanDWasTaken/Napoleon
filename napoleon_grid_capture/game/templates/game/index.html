<!-- chat/templates/chat/index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Games</title>
</head>
<body>
    What game would you like to join?<br>
    <input id="game-id-input" type="text" size="100"><br>
    <input id="game-id-submit" type="button" value="Enter">

    <script>
        document.querySelector('#game-id-input').focus();
        document.querySelector('#game-id-input').onkeyup = function(e) {
            if (e.keyCode === 13) {  // enter, return
                document.querySelector('#game-id-submit').click();
            }
        };

        document.querySelector('#game-id-submit').onclick = function(e) {
            var roomName = document.querySelector('#game-id-input').value;
            window.location.pathname = '/game/' + roomName + '/';
        };
    </script>
</body>
</html>
