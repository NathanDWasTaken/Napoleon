{% extends "game/base.html" %}
{% block content %}

{{ game_id|json_script:"game-id" }}
<div id="main-container">
    <section>
        <table id="score-board" style="float:right;">
        </table>
    </section>
</div>
<style>
    section {
        display: block;
        float: right;
        margin: 0 5%;
        width: 60%;
    }
    
    td {
        padding:0 10px;
    }
</style>

<script>
    var css = "font-family: Impact, fantasy ;font-size : 70px"

    console.log("%cHol' Up!", css);
    console.log("%cChanging things here can mess up your current game!", "font-size : 15px")
    console.log("%cAct with Caution!", "color: red; font-size : 25px; font-weight: 1000")
</script>

<script type="text/javascript">
    let columns = 4
    let rows = 4

    const game_id = "local_{{ game_id }}"
    let lines = []

    let players = []
    let players_dict = {}
    var player_turn_counter = 0

    const standart_gray = "rgb(211,211,211)"

    function add_line(x1, y1, x2, y2, id = null, grid=false) {
        var newLine = document.createElementNS('http://www.w3.org/2000/svg','line');

        let width = 8
        let colour = standart_gray
        if (id != null) {
            newLine.setAttribute('id', id);
        }

        if (grid) {
            if (id.includes("s")) {
                x1 = parseInt(x1) - width / 2
                x2 = parseInt(x2) + width / 2
            }

            else if (id.includes("e")) {
                y1 = parseInt(y1) - width / 2
                y2 = parseInt(y2) + width / 2
            }
        }

        newLine.setAttribute('x1', x1);
        newLine.setAttribute('y1', y1);
        newLine.setAttribute('x2', x2);
        newLine.setAttribute('y2', y2);
        newLine.setAttribute("stroke", colour)
        newLine.setAttribute("stroke-width", width)

        return newLine
    }

    function add_player(username, colour) {
        var player = new Player(username, colour)
        players.push(player)
        players_dict[username] = player

        //Add to table
        const table = document.getElementById("score-board")
        let row = table.insertRow()
        row.id = `row-${username}`

        let cell = row.insertCell()
        let font = document.createElement("font")
        font.setAttribute("color", colour)
        font.setAttribute("id", `name-${username}`)
        font.innerText = username
        cell.appendChild(font)

        cell = row.insertCell()
        font = document.createElement("font")
        font.setAttribute("color", colour)
        font.setAttribute("id", `score-${username}`)
        font.innerText = 0

        cell.appendChild(font)
        

        return player
    }

    function rgb_to_rgba(rgb, a) {
        if(rgb.indexOf('a') == -1) {
            return rgb.replace(')', `, ${a})`).replace('rgb', 'rgba');
        }}



    function createGrid() {
        let column_len = 50
        let row_len = column_len

        let svg_width = column_len * columns
        let svg_height = row_len * rows


        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.id = "grid"

        svg.setAttribute("width", svg_width);
        svg.setAttribute("height", svg_height);
        
        // Create rectangles
        for (row = 0; row < rows; row++) {
            for (column = 1; column <= columns; column++) {
                let x = column * column_len
                let y = row * row_len

                const newRect = document.createElementNS('http://www.w3.org/2000/svg','rect');
                newRect.id = `${column-1}-${row}`
                newRect.setAttribute("width", column_len)
                newRect.setAttribute("height", row_len)
                newRect.setAttribute("x", x-column_len)
                newRect.setAttribute("y", y)
                newRect.setAttribute("fill", "none")
                newRect.setAttribute("opacity", "0")
                svg.appendChild(newRect)
            }
        }
        
        // Create vertical Lines
        for (row = 0; row < rows; row++) {
            for (column = 1; column < columns; column++) {
                let x = column * column_len
                let y = row * row_len

                const newLine = add_line(x, y, x, y + row_len, id=`${column-1}-${row}-e`, grid = true)
                newLine.setAttribute("marked", "false")
                svg.appendChild(newLine)

                lines.push(newLine)
            }
        }

        // Create Horizontal Lines
        for (column = 0; column < columns; column++) {
            for (row = 1; row < rows; row++) {

                let x = column * column_len
                let y = row * row_len

                const newLine = add_line(x, y, x + column_len, y, id=`${column}-${row-1}-s`, grid = true)
                newLine.setAttribute("marked", "false")
                svg.appendChild(newLine)

                lines.push(newLine)
            }
        }


        document.getElementById("main-container").appendChild(svg)



        document.getElementById("grid").childNodes.forEach(function(line){
            if (line.tagName == "line") {
                const svg = document.getElementById("grid")
                

                line.addEventListener('mouseenter', function (event) {
                    const old_highlight = document.getElementById("highlighted")
                    if (old_highlight != null) {old_highlight.remove()}

                    if (line.getAttribute("marked") == "false") {
                        make_highlight(line.id, players[player_turn_counter].colour)
                    }
                })
            }})

        // Create the border
        svg.appendChild(add_line(0, 0, 0, svg_height))
        svg.appendChild(add_line(0, 0, svg_width, 0))
        svg.appendChild(add_line(0, svg_height, svg_width, svg_height))
        svg.appendChild(add_line(svg_width, 0, svg_width, svg_height))
    }

    
    function create_random_username(length) {
        var result           = '';
        var characters       = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var charactersLength = characters.length;
        for ( var i = 0; i < length; i++ ) {
            result += characters.charAt(Math.floor(Math.random() * charactersLength));
        }
        return result;
    }

    function make_highlight(line_id, player_colour) {
        if ((multiplayer && my_turn) || !multiplayer) {
            const svg = document.getElementById("grid")

            const line = document.getElementById(line_id)
            const x1 = line.getAttribute("x1")
            const y1 = line.getAttribute("y1")
            const x2 = line.getAttribute("x2")
            const y2 = line.getAttribute("y2")

            const highlight = add_line(x1, y1, x2, y2, id="highlighted")
            highlight.setAttribute("stroke-width", "12")
            highlight.setAttribute("stroke", rgb_to_rgba(player_colour, "0,9"))

            highlight.addEventListener('mouseleave', function (event) {
                highlight.remove()
            })

            highlight.addEventListener('click', function (event) {
                if (line.getAttribute("marked") == "false") {

                    let player = players[player_turn_counter]
                    let next_player = players[(player_turn_counter + 1) % players.length]

                    // make a move
                    gameSocket.send(JSON.stringify({
                        'command' : 'make move',
                        'wall': line.id,
                        'colour' : player.colour,
                        'player' : player.username,
                        'next player' : next_player.username,
                        'next colour' : next_player.colour
                    }));
                }
            })
            svg.appendChild(highlight)
        }

    }

    function victory() {
        var most_score = null // {"users" : [null], "score" : null}
        for (const index in players) {
            let player = players[index]
            if (most_score == null) {
                console.log("First")
                most_score = {"users" : [player], "score" : player.score}
                console.log(most_score)
            } else {
                if (player.score > most_score["score"]) {
                    most_score["users"] = [player]
                    most_score["score"] = player.score
                }
                else if (player.score == most_score["score"]) {
                    most_score["users"].push(player)
                }
            }
        }
        let winner = most_score["users"]
        console.log("The winner(s) is/are", winner)
    }

    class Player {
        constructor(username, colour) {
            this.username = username
            this.colour = colour
            this.score = 0
        }
    }
</script>

{% block connectivity %}{% endblock %}


{% endblock content %}
