{% extends "game/base.html" %}
{% block content %}

{% load static %}

{{ game_id|json_script:"game-id" }}
<div id="main-container" style="width: 100%; height: 100%;">
    <section class="section-right">
        <table id="score-board" style="float:right;">
        </table>
    </section>
</div>
<style>
    .section-right {
        display: block;
        float: right;
        margin: 0 5%;
        width: 60%;
    }
    
    /* Change distance between cell */
    td {
        padding:0 10px;
    }

    #winning-screen {
        width: 100%;
        height: 100%;
        position: absolute;
        z-index: 1;
    }

    #winning-message {
        text-align: center;
        font-size: 100px;
        font-family: Impact, fantasy;
    }

    rect {
        opacity: 1;
    }
</style>

<script>
    const game_id = "local_{{ game_id }}"
</script>

<script type="text/javascript" src="{% static 'grid.js' %}"></script>

{% block connectivity %}{% endblock %}


{% endblock content %}
